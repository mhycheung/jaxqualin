[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
version = "1.0.0"
name = "jaxqualin"
authors = [
  { name="Mark Ho-Yeuk Cheung", email="mcheung@ias.edu" },
]
description = "A package for extracting quasinormal modes from time domain data"
readme = "README.md"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "adjustText==0.8",
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
  "matplotlib>3.6.1",
  "optimistix",
  "numpy>1.23,<2.4",
  "pandas>1.5.1",
  "pykerr>=0.1.0",
  "quaternionic",
  "qnm==0.4.4",
  "setuptools",
  "spherical",
  "scipy>=1.13",
  "sxs>2025",
  "tqdm>4.61.1",
]

[project.urls]
"Homepage" = "https://github.com/mhycheung/Jaxqualin"
"Bug Tracker" = "https://github.com/mhycheung/Jaxqualin/issues"
