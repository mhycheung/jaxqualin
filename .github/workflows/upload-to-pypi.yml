name: Build and Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build from (branch, tag, or SHA)"
        required: true
        default: "main"
      run-tests:
        description: "Run lint + pytest before build"
        required: true
        type: boolean
        default: true
      publish:
        description: "Publish built artifacts to PyPI"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name == 'release' || inputs.run-tests }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution packages
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' && (github.event_name == 'release' || inputs.publish) }}
    permissions:
      id-token: write
    env:
      HAS_TWINE_TOKEN: ${{ secrets.TWINE_TOKEN }}

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI (token)
        if: ${{ env.HAS_TWINE_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TWINE_TOKEN }}
          skip-existing: true

      - name: Publish to PyPI (trusted publishing)
        if: ${{ env.HAS_TWINE_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
