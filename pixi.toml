[project]
name = "jaxqualin"
version = "1.0.0"
description = "A package for extracting quasinormal modes from time domain data"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.15"
tqdm = ">4.61.1"
setuptools = "*"
pip = "*"
pytest = ">=9.0.2"
scipy = ">=1.13"
numpy = ">1.23,<2.4"

[pypi-dependencies]
adjustText = "==0.8"
jax = ">=0.4.30"
jaxlib = ">=0.4.30"

matplotlib = ">3.6.1"
optimistix = "*"
pandas = ">1.5.1"
pykerr = ">=0.1.0"
qnm = "==0.4.4"
quaternionic = "*"
spherical = "*"
sxs = ">2025"
marimo = "*"

[tasks]
export-docs = "for f in docs/notebooks/*.py; do marimo export html \"$f\" -o \"${f%.py}.html\"; done"
build-docs = { cmd = "mkdocs build", depends-on = ["export-docs"] }
